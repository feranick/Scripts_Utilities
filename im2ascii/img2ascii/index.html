<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image to ASCII Converter</title>
    
    <link rel="stylesheet" href="https://pyscript.net/releases/2026.6.1/core.css" />
    <script type="module" src="https://pyscript.net/releases/2026.6.1/core.js"></script>
    
    <style>
        body { font-family: system-ui, -apple-system, sans-serif; display: flex; flex-direction: column; align-items: center; padding: 2rem; background-color: #f4f4f9; }
        .container { max-width: 700px; width: 100%; text-align: center; background: white; padding: 2rem; border-radius: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); box-sizing: border-box; }
        
        .upload-section { margin-bottom: 20px; padding: 30px; border: 3px dashed #ccc; border-radius: 10px; background: #fafafa; }
        .controls { display: flex; gap: 15px; justify-content: center; align-items: center; margin: 20px 0; }
        
        input[type="number"] { width: 80px; padding: 5px; border: 1px solid #ccc; border-radius: 4px; }
        button { background: #4A90E2; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; font-weight: bold; }
        button:hover { background: #357ABD; }
        button:disabled { background: #ccc; cursor: not-allowed; }

        /* Crucial for rendering ASCII art correctly */
        #ascii-preview { 
            font-family: monospace; 
            font-size: 8px; 
            line-height: 0.6; 
            letter-spacing: 0;
            white-space: pre; 
            text-align: left; 
            background: #222; 
            color: #fff; 
            padding: 15px; 
            overflow-x: auto; 
            border-radius: 5px; 
            margin-top: 20px;
            display: none;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Image to ASCII Converter</h2>
    
    <div class="upload-section">
        <input type="file" id="file-upload" accept="image/*">
    </div>

    <div class="controls">
        <label for="width-input">Width (characters):</label>
        <input type="number" id="width-input" value="100" min="20" max="300">
        
        <button id="convert-btn">Convert to ASCII</button>
        <button id="download-btn" style="display: none; background: #2ecc71;">Download .txt</button>
    </div>

    <div id="status-message"></div>
    <pre id="ascii-preview"></pre>
</div>

<script type="py" src="./main.py" config="./pyscript.toml"></script>

</body>
</html>
